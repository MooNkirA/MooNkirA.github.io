    <!-- <script src="./resources/js/docsify-themeable@0.8.4/docsify-themeable.min.js"></script> -->

    <!-- javaScript 脚本 -->

    <script>
      var num = 0
      mermaid.initialize({ startOnLoad: false })

      window.$docsify = {
        // logo: './css/svg/086-determined-face.svg',
        name: "<a class='app-name-link' data-nosearch='' href='#/'><div class='moon-logo'></div></a>",
        // repo: 'https://github.com/MooNkirA/code-learning-note',
        maxLevel: 6, // 最大支持渲染的标题层级
        // subMaxLevel: 5,
        homepage: 'README.md',
        coverpage: false, // 添加一个封面
        loadSidebar: false, // 添加侧边栏文件，默认名称
        // _sidebar.md 的加载逻辑是从每层目录下获取文件，如果当前目录不存在该文件则回退到上一级目录。
        // 例如当前路径为 /zh-cn/more-pages 则从 /zh-cn/_sidebar.md 获取文件，如果不存在则从 /_sidebar.md 获取。
        // autoHeader: true,  // 同时设置 loadSidebar 和 autoHeader 后，可以根据 _sidebar.md 的内容自动为每个页面增加标题。

        // alias: {
        //   "/.*/_sidebar.md": "/_sidebar.md",
        // }, // 配置 alias 避免不必要的回退过程

        mergeNavbar: true, // 在较小的屏幕上，导航栏将与边栏合并。
        loadNavbar: false, // 添加导航栏 load from _navbar.md
        auto2top: true, // 切换页面后是否自动跳转到页面顶部
        // 全文搜索
        search: {
          maxAge: 86400000, // 过期时间，单位毫秒，默认一天
          paths: 'auto',
          placeholder: '🔍 搜索...',
          noData: '😅 找不到结果...',
          // 搜索标题的最大程级, 1 - 6
          depth: 6,
        },
        // externalLinkTarget: '_self' // Target to open external links inside the markdown. Default '_blank' (new window/tab)
        // themeColor: '#3F51B5'
        // 复制文本
        copyCode: {
          buttonText: 'Copy to clipboard',
          errorText: 'Error',
          successText: 'Copied',
        },

        // 开启
        themeable: {
          readyTransition: true, // default: true
          // responsiveTables: false, // default: true
        },

        // 定制 Markdown 解析规则
        markdown: {
          renderer: {
            code: function (code, lang) {
              if (lang === 'mermaid') {
                return (
                  '<div class="mermaid">' + mermaid.render('mermaid-svg-' + num++, code) + '</div>'
                )
              }
              return this.origin.code.apply(this, arguments)
            },
          },
        },
        darklightTheme: {
          siteFont: 'PT Sans',
          defaultTheme: 'dark',
          codeFontFamily: 'Roboto Mono, Monaco, courier, monospace',
          bodyFontSize: '17px',
          dark: {
            accent: '#42b983',
            toogleBackground: '#ffffff',
            background: '#091a28',
            textColor: '#b4b4b4',
            codeTextColor: '#ffffff',
            codeBackgroundColor: '#0e2233',
            borderColor: '#0d2538',
            blockQuoteColor: '#858585',
            highlightColor: '#d22778',
            sidebarSublink: '#b4b4b4',
            codeTypeColor: '#ffffff',
            coverBackground:
              'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
            toogleImage: 'url(./resources/images/docsify-darklight-theme/sun.svg)',
          },
          light: {
            accent: '#42b983',
            toogleBackground: '#091a28',
            background: '#ffffff',
            textColor: '#34495e',
            codeTextColor: '#525252',
            codeBackgroundColor: '#f8f8f8',
            borderColor: 'rgba(0, 0, 0, 0.07)',
            blockQuoteColor: '#858585',
            highlightColor: '#d22778',
            sidebarSublink: '#b4b4b4',
            codeTypeColor: '#091a28',
            coverBackground:
              'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
            toogleImage: 'url(./resources/images/docsify-darklight-theme/moon.svg)',
          },
        },
        // 自定义插件：完整支持 Obsidian 所有Wiki链接
        plugins: [
          function (hook, vm) {
            let fileMap = {};

            // 初始化加载文件索引
            hook.init(async function () {
              try {
                const res = await fetch("/resources/file-map.json");
                fileMap = await res.json();
                console.log("✅ 文档索引加载成功", fileMap);
              } catch (e) {
                console.error("❌ 索引加载失败", e);
              }
            });

            // 解析前替换所有 Obsidian 链接（支持4种格式）
            hook.beforeEach(function (content) {
              if (!fileMap || Object.keys(fileMap).length === 0) return content;

              // 【终极正则】匹配所有4种Obsidian链接格式
              const obsidianRegex = /\[\[([^\#|\]]+)(?:#([^|\]]+))?(?:\|([^\]]+))?\]\]/g;

              return content.replace(obsidianRegex, (match, fileName, anchor, alias) => {
                // 1. 查找文件真实路径
                const realPath = fileMap[fileName.trim()];
                if (!realPath) return match; // 找不到文件，保留原文

                // 2. 处理显示文本（别名优先，无别名用文件名）
                const displayText = (alias || fileName).trim();

                // 3. 处理锚点（标题）
                let url = realPath;
                if (anchor) {
                  url += `#${anchor.trim()}`;
                }

                // 4. 返回标准Markdown链接
                return `[${displayText}](${url})`;
              });
            });
          }
        ]
      }
    </script>
